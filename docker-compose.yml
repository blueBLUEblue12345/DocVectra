version: "3.8"

services:
  # ========== 依赖服务 ==========

  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: docvectra-milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: docvectra-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: docvectra-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: docvectra-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # ========== 应用服务 ==========

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docvectra-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - milvus
      - mongodb
      - minio
      - redis
    restart: unless-stopped
    # GPU 直通（需要 nvidia-docker）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docvectra-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  milvus_data:
  mongo_data:
  minio_data: